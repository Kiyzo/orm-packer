name: Web (GitHub Pages)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install WebAssembly AOT toolchain
        run: dotnet workload restore web/OrmPacker.Web/OrmPacker.Web.csproj

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build EXR/WASM decoder
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Publish Blazor WebAssembly
        run: dotnet publish web/OrmPacker.Web/OrmPacker.Web.csproj -c Release -o web-publish

      - name: Disable Jekyll processing
        # Jekyll drops underscore-prefixed paths; without .nojekyll the Blazor _framework/ files are not published.
        run: touch web-publish/wwwroot/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
